name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python tests/syntax_check.py
      - run: python -m geiter --help
      - run: python -m geiter prompt add "What is Geiter?" --intent discovery --json
      - run: python -m geiter regression --provider jsonl --fixture examples/answers.jsonl --json
      - run: python -m pip wheel --no-deps --no-build-isolation . -w "$RUNNER_TEMP/geiter-wheel"
      - run: python -m pip install --force-reinstall --no-deps --find-links "$RUNNER_TEMP/geiter-wheel" geiter
      - run: python -c "import geiter; assert geiter.__version__"
      - run: geiter --help
